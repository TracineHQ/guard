name: Plugin install

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-marketplace:
    name: Local manifest install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - run: claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate ./.claude-plugin/marketplace.json

      - name: Add this branch as a local marketplace
        run: claude plugin marketplace add ./

      - name: Install guard from local marketplace
        run: claude plugin install guard@tracinehq

      - name: Assert plugin loaded cleanly
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=$(claude plugin list)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "guard@tracinehq" || { echo "FAIL: guard not in plugin list"; exit 1; }
          if echo "$OUTPUT" | grep -q "failed to load"; then
            echo "FAIL: guard reported 'failed to load'"
            exit 1
          fi
          if echo "$OUTPUT" | grep -q "Status: ✘"; then
            echo "FAIL: guard reported a non-enabled status"
            exit 1
          fi
          echo "OK: guard installed from local manifest and enabled."

      - name: Install uv (for runtime hook subprocess test)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Pin Python version
        run: uv python pin 3.13

      - name: Install project deps
        run: uv sync --all-extras

      # Catches the 1.4.1-class regression where a hook crashes at runtime
      # because Claude Code invokes it as a bare `python3 hook.py` with no
      # PYTHONPATH. Cheap unit-level subprocess test; the full claude --print
      # integration can be a follow-up if/when credentials are available.
      - name: Hook subprocess invocation regression test
        run: uv run pytest tests/integration/test_hook_subprocess_invocation.py -v

  user-facing-install:
    name: Documented install path (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - run: claude --version

      - name: Add unified TracineHQ marketplace (README path)
        run: claude plugin marketplace add TracineHQ/plugins

      - name: Install guard from unified marketplace (README path)
        run: claude plugin install guard@tracine

      - name: Assert plugin loaded cleanly
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=$(claude plugin list)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "guard@tracine" || { echo "FAIL: guard not in plugin list"; exit 1; }
          if echo "$OUTPUT" | grep -q "failed to load"; then
            echo "FAIL: guard reported 'failed to load'"
            exit 1
          fi
          if echo "$OUTPUT" | grep -q "Status: ✘"; then
            echo "FAIL: guard reported a non-enabled status"
            exit 1
          fi
          echo "OK: guard installed via documented path and enabled."
